<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello wasm-pack!</title>
    <link href="app.css" rel="stylesheet" />
    <script
      id="main"
      async
      defer
      type="module"
      src="/dist/frontend/main.js"
    ></script>
  </head>
  <body>
    <div class="d-flex" style="margin-left: 20px">
      <div>
        <div id="canvashold"></div>
        <div>
          <button id="flip">flip</button>
          <button id="undo">undo</button>
          <button id="fish">fish</button>
          <button id="new">reset</button>
          <button id="newgame">new game</button>
          <button id="playas"></button>
          <button id="next">next</button>
          <span>oppo: </span>
          <select id="oppo">
            <option value="gf">glowfish</option>
            <option value="sf1">stockfish 1</option>
            <option value="sf2">stockfish 2</option>
            <option value="sf3">stockfish 3</option>
            <option value="sf4">stockfish 4</option>
            <option value="sf5">stockfish 5</option>
            <option value="sf6">stockfish 6</option>
            <option value="sf7">stockfish 7</option>
            <option value="sf8">stockfish 8</option>
          </select>
        </div>
        <div id="msgbox"></div>
      </div>
      <div id="sidebar" class="wrap p-1">
        <div id="info">turn:</div>
        <div id="turns"></div>
      </div>
    </div>

    <script>
      const script = document.getElementById("main");

      script.onload = () => {
        window.main();
      };
    </script>
  </body>
</html>
