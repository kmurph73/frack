<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello wasm-pack!</title>
    <link href="app.css" rel="stylesheet" />
    <script
      id="main"
      async
      defer
      type="module"
      src="/dist/frontend/main.js"
    ></script>
  </head>
  <body>
    <div class="d-flex" style="margin-left: 20px">
      <div>
        <div id="canvashold"></div>
        <div>
          <button id="flip">flip</button>
          <button id="undo">undo</button>
          <button id="fish">fish</button>
          <button id="new">reset</button>
          <button id="playas"></button>
          <button id="start">start</button>
        </div>
        <div id="msgbox"></div>
      </div>
      <div id="sidebar" class="wrap p-1">
        <div id="info">turn:</div>
        <div id="turns"></div>
      </div>
    </div>

    <script>
      const script = document.getElementById("main");

      script.onload = () => {
        window.main();
      };
    </script>
  </body>
</html>
