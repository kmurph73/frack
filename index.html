<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jojo chess</title>
    <link href="app.css" rel="stylesheet" />
    <script type="module" src="dist/frontend/main.js"></script>
  </head>
  <body>
    <div id="layout" class="d-flex">
      <div id="boardcol">
        <div id="canvashold"></div>
        <div>
          <button id="flip">flip</button>
          <button id="undo">undo</button>
          <button id="fish">fish</button>
          <button id="new">reset</button>
          <button id="newgame">new game</button>
          <button id="playas"></button>
          <label class="autoplay-group">
            <input type="checkbox" id="autoplay" />
            auto play
          </label>
          <button id="next">play</button>
          <span class="oppo-group">
            <span>oppo: </span>
            <select id="oppo">
              <option value="gfw">glowfish weak</option>
              <option value="gf">glowfish</option>
              <option value="gfs">glowfish strong</option>
              <option value="sf1">stockfish 1</option>
              <option value="sf2">stockfish 2</option>
              <option value="sf3">stockfish 3</option>
              <option value="sf4">stockfish 4</option>
              <option value="sf5">stockfish 5</option>
              <option value="sf6">stockfish 6</option>
              <option value="sf7">stockfish 7</option>
              <option value="sf8">stockfish 8</option>
            </select>
          </span>
        </div>
        <div id="msgbox"></div>
      </div>
      <div id="sidebar" class="wrap p-1">
        <div id="info">turn:</div>
        <div id="turns"></div>
      </div>
    </div>
  </body>
</html>
